[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrestore"
version = "0.1.0"
description = "Drift-aware resume middleware for agent frameworks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentRestore contributors" }]
keywords = ["agents", "checkpoint", "durable-execution", "langgraph", "reliability"]
dependencies = [
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
langgraph = [
    "langgraph>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["agentrestore"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
